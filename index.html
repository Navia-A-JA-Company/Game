<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密室逃脫：時光之謎</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+HK:wght@400;500;700;900&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a24;
            --bg-button: #252532;
            --accent-1: #00ff88;
            --accent-2: #00d4ff;
            --accent-3: #ff6b35;
            --accent-gold: #ffd700;
            --text-primary: #f0f0f5;
            --text-secondary: #8888a0;
            --shadow-glow: rgba(0, 255, 136, 0.4);
            --shadow-blue: rgba(0, 212, 255, 0.3);
            --danger: #ff4757;
            --success: #2ed573;
            --phone-green: #1a4a42;
            --phone-green-light: #2a6a5a;
            --phone-green-dark: #0f2f28;
            --phone-gold: #c9a227;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans HK', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        .screen {
            display: none;
            min-height: 100vh;
            padding: 20px;
            width: 100%;
            animation: fadeIn 0.5s ease;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px var(--shadow-glow); }
            50% { box-shadow: 0 0 40px var(--shadow-glow), 0 0 60px var(--shadow-blue); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        /* Timer Display */
        .timer-fixed {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--bg-card);
            padding: 12px 24px;
            border-radius: 16px;
            border: 2px solid var(--accent-2);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: none;
        }

        .timer-fixed.active { display: block; }

        .timer-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--accent-2);
            letter-spacing: 3px;
        }

        .timer-fixed.warning .timer-display { color: var(--accent-3); animation: pulse 1s infinite; }
        .timer-fixed.danger .timer-display { color: var(--danger); animation: pulse 0.5s infinite; }

        /* Start Screen */
        .start-screen { text-align: center; max-width: 500px; position: relative; z-index: 1; }

        #startScreen {
            background: linear-gradient(rgba(10, 10, 15, 0.8), rgba(10, 10, 15, 0.8)), url('https://images.unsplash.com/photo-1519074063912-ad2fe3f5190a?auto=format&fit=crop&q=80&w=1000');
            background-size: cover;
            background-position: center;
        }

        .game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
            letter-spacing: 4px;
        }

        .box-cover {
            width: 200px;
            height: 200px;
            background: linear-gradient(145deg, var(--bg-card), var(--bg-secondary));
            border: 4px solid var(--accent-1);
            border-radius: 24px;
            margin: 0 auto 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 30px var(--shadow-glow);
            animation: glow 3s infinite;
        }

        .start-btn {
            padding: 18px 50px;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            border: none;
            border-radius: 50px;
            font-family: 'Noto Sans HK', sans-serif;
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--bg-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px var(--shadow-glow);
            margin-bottom: 30px;
        }

        .start-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 40px var(--shadow-glow); }

        .warning-text {
            font-size: 0.9rem;
            color: var(--accent-3);
            padding: 12px 20px;
            background: rgba(255, 107, 53, 0.1);
            border: 1px solid var(--accent-3);
            border-radius: 12px;
        }

        /* Timer Setup */
        .timer-big {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            font-weight: 900;
            color: var(--accent-2);
            text-shadow: 0 0 20px var(--shadow-blue);
            margin: 30px 0;
        }

        /* Envelope */
        .envelope-icon { font-size: 6rem; margin-bottom: 20px; animation: bounce 1.5s infinite; }
        .envelope-message {
            font-size: 1.6rem;
            font-weight: 700;
            padding: 30px;
            background: var(--bg-card);
            border-radius: 20px;
            border: 2px solid var(--accent-1);
        }

        .progress-bar { width: 200px; height: 6px; background: var(--bg-button); border-radius: 3px; margin: 15px auto; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: var(--accent-1); transition: width 0.1s linear; }

        /* Phone */
        .rotary-phone-container {
            background: var(--phone-green);
            border-radius: 30px;
            padding: 25px;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            position: relative;
        }

        .phone-display {
            background: #000;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
            border: 2px solid var(--phone-green-dark);
        }

        .display-number { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; color: var(--accent-1); }

        .rotary-dial {
            width: 240px;
            height: 240px;
            background: #222;
            border-radius: 50%;
            margin: 0 auto 20px;
            position: relative;
            box-shadow: inset 0 0 20px #000;
        }

        .dial-plate {
            width: 100%;
            height: 100%;
            position: absolute;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dial-hole {
            position: absolute;
            width: 35px;
            height: 35px;
            background: #000;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--phone-gold);
            font-weight: bold;
            font-family: 'JetBrains Mono';
        }

        .phone-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .action-btn { padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .action-btn.clear { background: #800; color: white; }
        .action-btn.call { background: var(--accent-1); color: black; }

        /* Password Slots */
        .password-display { display: flex; gap: 10px; margin-bottom: 20px; }
        .password-slot {
            width: 50px;
            height: 65px;
            background: var(--bg-button);
            border: 2px solid var(--accent-2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .password-slot.active { border-color: var(--accent-1); box-shadow: 0 0 10px var(--accent-1); }

        .password-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .password-key { padding: 15px; background: var(--bg-button); border: none; border-radius: 8px; color: white; cursor: pointer; }

        /* Success Overlay */
        .success-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .success-overlay.show { display: flex; }
        .success-content { text-align: center; padding: 40px; background: var(--bg-card); border-radius: 20px; border: 2px solid var(--accent-1); }

        /* Direction Grid */
        .direction-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .direction-btn { padding: 20px; background: var(--bg-card); border: 2px solid var(--accent-2); border-radius: 12px; color: white; cursor: pointer; }

        .status-msg { margin-top: 15px; font-weight: bold; min-height: 24px; }
        .status-msg.error { color: var(--danger); animation: shake 0.4s ease; }

        .time-modifier {
            position: fixed; top: 80px; right: 20px; padding: 10px 20px; border-radius: 10px;
            font-weight: bold; opacity: 0; transition: 0.3s; z-index: 1001;
        }
        .time-modifier.show { opacity: 1; }
        .time-modifier.add { background: var(--success); color: black; }
        .time-modifier.sub { background: var(--danger); color: white; }
    </style>
</head>
<body>

    <div class="timer-fixed" id="timerFixed">
        <div class="timer-display" id="timerDisplay">45:00</div>
    </div>

    <div class="time-modifier" id="timeModifier"></div>

    <!-- Screen 1: Start -->
    <div class="screen active" id="startScreen">
        <div class="start-screen">
            <h1 class="game-title">密室逃脫</h1>
            <div class="box-cover">📦</div>
            <button class="start-btn" id="startGameBtn">開始遊戲</button>
            <p class="warning-text">⚠️ 請先仔細閱讀說明書才打開任何信封</p>
        </div>
    </div>

    <!-- Screen 2: Timer Setup -->
    <div class="screen" id="timerSetupScreen">
        <div class="text-center">
            <h2 class="game-title">準備開始</h2>
            <div class="timer-big">45:00</div>
            <button class="start-btn" id="startTimerBtn">啟動倒計時</button>
        </div>
    </div>

    <!-- Screen 3: Envelope 1 -->
    <div class="screen" id="envelope1Screen">
        <div class="text-center">
            <div class="envelope-icon">✉️</div>
            <div class="envelope-message">請打開 1 號信封<br>並閱讀引文</div>
            <div class="progress-bar"><div class="progress-fill" id="progress1"></div></div>
        </div>
    </div>

    <!-- Screen 4: Phone -->
    <div class="screen" id="phoneScreen">
        <div class="rotary-phone-container">
            <div class="phone-display">
                <div class="display-number" id="phoneDisplay">請撥號</div>
            </div>
            <div class="rotary-dial">
                <div class="dial-plate" id="dialPlate"></div>
            </div>
            <div class="phone-actions">
                <button class="action-btn clear" id="phoneClearBtn">清除</button>
                <button class="action-btn call" id="phoneCallBtn">撥打</button>
            </div>
            <div class="status-msg" id="phoneStatus"></div>
        </div>
    </div>

    <!-- Screen 5: Level 2 -->
    <div class="screen" id="level2Screen">
        <h2 class="game-title" style="font-size: 1.5rem;">🔒 破解鐵閘密碼</h2>
        <div class="password-display" id="pass2Display">
            <div class="password-slot active">_</div>
            <div class="password-slot">_</div>
            <div class="password-slot">_</div>
            <div class="password-slot">_</div>
        </div>
        <div class="password-keypad" id="keypad2">
            <button class="password-key">1</button><button class="password-key">2</button><button class="password-key">3</button>
            <button class="password-key">4</button><button class="password-key">5</button><button class="password-key">6</button>
            <button class="password-key">7</button><button class="password-key">8</button><button class="password-key">9</button>
            <button class="password-key" style="background:#555">⌫</button><button class="password-key">0</button><button class="password-key" style="background:var(--accent-1);color:black">✓</button>
        </div>
        <div class="status-msg" id="level2Status"></div>
    </div>

    <!-- Screen 6: Level 3 -->
    <div class="screen" id="level3Screen">
        <h2 class="game-title" style="font-size: 1.5rem;">🚃 尋找電車站號碼</h2>
        <div class="password-display" id="pass3Display">
            <div class="password-slot active">_</div>
            <div class="password-slot">_</div>
        </div>
        <div class="password-keypad" id="keypad3">
            <button class="password-key">1</button><button class="password-key">2</button><button class="password-key">3</button>
            <button class="password-key">4</button><button class="password-key">5</button><button class="password-key">6</button>
            <button class="password-key">7</button><button class="password-key">8</button><button class="password-key">9</button>
            <button class="password-key" style="background:#555">⌫</button><button class="password-key">0</button><button class="password-key" style="background:var(--accent-1);color:black">✓</button>
        </div>
        <div class="status-msg" id="level3Status"></div>
    </div>

    <!-- Screen 7: Choice -->
    <div class="screen" id="level4Screen">
        <div class="text-center" style="max-width: 400px;">
            <p style="margin-bottom: 20px; font-size: 1.2rem;">🚃 電車仲有排先到站⋯⋯</p>
            <button class="direction-btn" id="choice1" style="width:100%; margin-bottom:10px;">
                趁依段時間好好了解吓身邊嘅街坊！<br><small style="color:var(--accent-1)">⏰ +7 分鐘</small>
            </button>
            <button class="direction-btn" id="choice2" style="width:100%;">
                時間過得咁快⋯電車好似就嚟到<br><small style="color:var(--danger)">⏰ -7 分鐘</small>
            </button>
        </div>
    </div>

    <!-- Screen 8: Questions -->
    <div class="screen" id="questionsScreen">
        <div class="text-center" style="max-width: 400px;">
            <div class="envelope-message" id="questionText" style="margin-bottom: 20px;">問題載入中...</div>
            <button class="start-btn" id="nextQuestion" style="font-size: 1rem;">🎲 下一條問題</button>
            <button class="start-btn" id="finishQuestions" style="font-size: 1rem; background: var(--accent-2);">🚃 電車終於到站！</button>
        </div>
    </div>

    <!-- Screen 9: Envelope 5 -->
    <div class="screen" id="envelope5Screen">
        <div class="text-center">
            <div class="envelope-icon">✉️</div>
            <div class="envelope-message">現在請打開 5 號信封</div>
            <div class="progress-bar"><div class="progress-fill" id="progress5"></div></div>
        </div>
    </div>

    <!-- Screen 10: Direction -->
    <div class="screen" id="directionScreen">
        <h2 class="game-title" style="font-size: 1.2rem;">🗺️ 太平山喺邊個方向？</h2>
        <div class="direction-grid">
            <button class="direction-btn" data-dir="east">東 East</button>
            <button class="direction-btn" data-dir="south">南 South</button>
            <button class="direction-btn" data-dir="west">西 West</button>
            <button class="direction-btn" data-dir="north">北 North</button>
        </div>
        <div class="status-msg" id="dirStatus"></div>
    </div>

    <!-- Screen 11: Final -->
    <div class="screen" id="finalScreen">
        <div class="text-center">
            <div class="envelope-icon">🏆</div>
            <h1 class="game-title">成功通關！</h1>
            <p style="margin-bottom: 20px;">📖 請閱讀說明書第七頁</p>
            <div class="envelope-message" style="font-size: 1rem;">希望你有個好的遊戲體驗！</div>
        </div>
    </div>

    <div class="success-overlay" id="successOverlay">
        <div class="success-content">
            <div id="successIcon" style="font-size: 4rem; margin-bottom: 10px;">🎉</div>
            <h2 id="successTitle" style="color:var(--accent-1)">成功！</h2>
            <p id="successSubtitle">準備進入下一關</p>
        </div>
    </div>

    <script>
        // State
        let totalSeconds = 45 * 60;
        let timerInterval = null;
        let currentPhoneNum = "";
        let currentPass2 = "";
        let currentPass3 = "";

        const questions = [
            "你最喜歡香港嘅邊個地方？", "如果可以去世界任何地方，你會去邊度？", 
            "你覺得香港最好食嘅嘢係乜？", "你細個最鍾意玩咩遊戲？", 
            "你最難忘嘅童年回憶？", "如果你可以擁有一種超能力，你會揀乜？"
        ];

        // Audio Helpers
        const playSound = (freq, dur) => {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = freq; gain.gain.setValueAtTime(0.1, ctx.currentTime);
            osc.start(); osc.stop(ctx.currentTime + dur);
        };

        // Navigation
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function showOverlay(icon, title, sub, dur, cb) {
            const overlay = document.getElementById('successOverlay');
            document.getElementById('successIcon').textContent = icon;
            document.getElementById('successTitle').textContent = title;
            document.getElementById('successSubtitle').textContent = sub;
            overlay.classList.add('show');
            playSound(800, 0.2);
            setTimeout(() => {
                overlay.classList.remove('show');
                if(cb) cb();
            }, dur);
        }

        // Timer Logic
        function startTimer() {
            if (timerInterval) return;
            document.getElementById('timerFixed').classList.add('active');
            timerInterval = setInterval(() => {
                if (totalSeconds <= 0) {
                    clearInterval(timerInterval);
                    return;
                }
                totalSeconds--;
                const m = Math.floor(totalSeconds / 60);
                const s = totalSeconds % 60;
                document.getElementById('timerDisplay').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                
                const timerBox = document.getElementById('timerFixed');
                if (totalSeconds < 300) timerBox.classList.add('danger');
                else if (totalSeconds < 600) timerBox.classList.add('warning');
            }, 1000);
        }

        function modifyTime(sec, isAdd) {
            totalSeconds += sec;
            const mod = document.getElementById('timeModifier');
            mod.textContent = `${isAdd ? '+' : '-'}${Math.abs(sec/60)} 分鐘`;
            mod.className = `time-modifier show ${isAdd ? 'add' : 'sub'}`;
            setTimeout(() => mod.classList.remove('show'), 2000);
        }

        // Rotary Dial Setup
        function initDial() {
            const plate = document.getElementById('dialPlate');
            plate.innerHTML = '';
            const nums = ['1','2','3','4','5','6','7','8','9','0'];
            nums.forEach((n, i) => {
                const angle = (i * 30 - 60) * (Math.PI / 180);
                const hole = document.createElement('div');
                hole.className = 'dial-hole';
                hole.textContent = n;
                hole.style.left = `${120 + 85 * Math.cos(angle) - 17}px`;
                hole.style.top = `${120 + 85 * Math.sin(angle) - 17}px`;
                hole.onclick = () => {
                    if (currentPhoneNum.length < 8) {
                        currentPhoneNum += n;
                        document.getElementById('phoneDisplay').textContent = currentPhoneNum;
                        playSound(400, 0.1);
                        plate.style.transform = `rotate(${(i+1)*30}deg)`;
                        setTimeout(() => plate.style.transform = 'rotate(0deg)', 300);
                    }
                };
                plate.appendChild(hole);
            });
        }

        // Event Listeners
        document.getElementById('startGameBtn').onclick = () => showScreen('timerSetupScreen');
        
        document.getElementById('startTimerBtn').onclick = () => {
            startTimer();
            showScreen('envelope1Screen');
            let p = 0;
            const bar = document.getElementById('progress1');
            const iv = setInterval(() => {
                p += 1;
                bar.style.width = p + '%';
                if (p >= 100) {
                    clearInterval(iv);
                    initDial();
                    showScreen('phoneScreen');
                }
            }, 50);
        };

        document.getElementById('phoneClearBtn').onclick = () => {
            currentPhoneNum = "";
            document.getElementById('phoneDisplay').textContent = "請撥號";
        };

        document.getElementById('phoneCallBtn').onclick = () => {
            const status = document.getElementById('phoneStatus');
            if (currentPhoneNum === "56123517") {
                showOverlay('📞', '通話成功', '請打開 2 號信封', 3000, () => showScreen('level2Screen'));
            } else {
                status.textContent = "❌ 號碼錯誤";
                status.className = "status-msg error";
                playSound(200, 0.3);
                setTimeout(() => status.textContent = "", 2000);
            }
        };

        // Keypad Logic
        function handleKeypad(key, type) {
            let pass = type === 2 ? currentPass2 : currentPass3;
            let limit = type === 2 ? 4 : 2;
            let displayId = type === 2 ? 'pass2Display' : 'pass3Display';
            let statusId = type === 2 ? 'level2Status' : 'level3Status';
            let correct = type === 2 ? "3122" : "72";

            if (key === '⌫') pass = pass.slice(0, -1);
            else if (key === '✓') {
                if (pass === correct) {
                    if (type === 2) showOverlay('🔓', '密碼正確', '請打開 3 號信封', 3000, () => showScreen('level3Screen'));
                    else showOverlay('🚃', '號碼正確', '請打開 4 號信封', 3000, () => showScreen('level4Screen'));
                } else {
                    const s = document.getElementById(statusId);
                    s.textContent = "❌ 錯誤"; s.className = "status-msg error";
                    playSound(200, 0.3);
                }
            } else if (pass.length < limit) {
                pass += key;
                playSound(500, 0.05);
            }

            if (type === 2) currentPass2 = pass; else currentPass3 = pass;
            
            const slots = document.getElementById(displayId).children;
            for(let i=0; i<slots.length; i++) {
                slots[i].textContent = pass[i] || "_";
                slots[i].className = `password-slot ${i === pass.length ? 'active' : ''}`;
            }
        }

        document.getElementById('keypad2').onclick = (e) => {
            if(e.target.tagName === 'BUTTON') handleKeypad(e.target.textContent, 2);
        };
        document.getElementById('keypad3').onclick = (e) => {
            if(e.target.tagName === 'BUTTON') handleKeypad(e.target.textContent, 3);
        };

        // Choice & Questions
        document.getElementById('choice1').onclick = () => {
            modifyTime(7 * 60, true);
            document.getElementById('questionText').textContent = questions[0];
            showScreen('questionsScreen');
        };
        document.getElementById('choice2').onclick = () => {
            modifyTime(-7 * 60, false);
            triggerEnvelope5();
        };

        document.getElementById('nextQuestion').onclick = () => {
            const q = questions[Math.floor(Math.random()*questions.length)];
            document.getElementById('questionText').textContent = q;
            playSound(600, 0.1);
        };

        document.getElementById('finishQuestions').onclick = () => triggerEnvelope5();

        function triggerEnvelope5() {
            showScreen('envelope5Screen');
            let p = 0;
            const bar = document.getElementById('progress5');
            const iv = setInterval(() => {
                p += 2;
                bar.style.width = p + '%';
                if (p >= 100) {
                    clearInterval(iv);
                    showScreen('directionScreen');
                }
            }, 50);
        }

        // Direction
        document.querySelectorAll('.direction-btn').forEach(btn => {
            btn.onclick = () => {
                if (btn.dataset.dir === 'east') {
                    showOverlay('✨', '抵達終點', '恭喜通關', 3000, () => showScreen('finalScreen'));
                } else {
                    const s = document.getElementById('dirStatus');
                    s.textContent = "❌ 方向錯誤"; s.className = "status-msg error";
                    playSound(200, 0.3);
                }
            };
        });

    </script>
</body>
</html>
