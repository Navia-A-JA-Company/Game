            if (audioContext.state === 'suspended') audioContext.resume();
            return audioContext;
        }
        function playTone(freq, dur) { 
            let ctx = getAudioContext(); if (!ctx) return;
            let osc = ctx.createOscillator(), gn = ctx.createGain();
            osc.connect(gn); gn.connect(ctx.destination);
            osc.frequency.value = freq; osc.type = 'sine';
            gn.gain.setValueAtTime(0.3, ctx.currentTime);
            gn.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + dur);
            osc.start(ctx.currentTime); osc.stop(ctx.currentTime + dur);

            const baseUrl = 'https://raw.githubusercontent.com/YOUR_USERNAME/YOUR_REPO/main/'; // 請替換為你的 GitHub raw 路徑

            const overlay = document.getElementById('dialingOverlay');
            const dialingText = document.getElementById('dialingText');
            const dialingSub = document.getElementById('dialingSub');
            dialingText.textContent = `📞 正在撥給 ${filename.replace('.m4a','')}`;
            dialingSub.textContent = '請稍候，連線中...';
            overlay.classList.add('show');
            playTone(440, 0.3);
            
            // 模擬撥號等待效果 (1.5秒後播放音檔)
            setTimeout(() => {
                // 實際播放音檔 (使用 Howler 或 Audio 元素)
                const audio = new Audio();
                // 嘗試 GitHub raw 鏈接，如果失敗則 fallback 到內置音效
                // 由於無法確定實際路徑，這裡示範使用內置 tone 表示音檔播放完成
                audio.oncanplaythrough = () => {
                    audio.play().catch(e => console.log("Audio play failed", e));
                };
                audio.onended = () => {
                    // 關閉浮層並執行回調
                    overlay.classList.remove('show');
                    if (onEndCallback) onEndCallback();

                    // 如果無法加載，使用內置音效代替，但仍然關閉浮層
                    console.warn(`無法加載音檔: ${filename}，使用內置音效`);
                    playTone(523, 0.5);
                    setTimeout(() => {
                        overlay.classList.remove('show');
                        if (onEndCallback) onEndCallback();
                    }, 800);
                };
                // 請將此處替換為實際的 GitHub raw 鏈接，例如：
                // audio.src = `https://raw.githubusercontent.com/你的用戶名/你的倉庫名/main/${filename}`;
                // 目前為演示，使用一個佔位，實際部署時請修改

        // 電話功能 (第二關)
        function updatePhoneDisplay() {
            let d = document.getElementById('phoneDisplay');
            if(phoneNumber==='') { d.textContent = i18nStrings[currentLang]['inputNumber'] || '輸入號碼'; d.classList.add('empty'); } 
            else { d.textContent = phoneNumber; d.classList.remove('empty'); }
        }
        function showPhoneStatus(msg, type) {
            let s = document.getElementById('phoneStatus');
            s.textContent = msg; s.className = 'phone-status ' + (type || '');
            setTimeout(()=>s.classList.remove('error', 'success'),3000);
        }
        function deductTime(minutes) {
            totalSeconds = Math.max(0, totalSeconds - (minutes * 60));
            updateTimerDisplay();
            playErrorSound();
        }
        function updateTimerDisplay() {
            let m = Math.floor(totalSeconds/60), s = totalSeconds%60;
            document.getElementById('timerDisplay').textContent = String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
        }
        
        // 定義電話號碼對應的音檔與回調
        const phoneContacts = {
            '56123517': { name: '豬肉榮', file: '猪肉榮.m4a', nextAction: () => { showReflection(2); setTimeout(() => showScreen('level2Screen'), 1500); } },
            '96721240': { name: '高佬泉', file: '高佬泉.m4a', nextAction: null },
            '63479512': { name: '王太', file: '王太.m4a', nextAction: null },
            '95460769': { name: '群姐', file: '群姐.m4a', nextAction: null }
        };
        
        function checkPhoneNumber() {
            if(phoneNumber==='') { showPhoneStatus(i18nStrings[currentLang]['enterNumber'] || '請先輸入號碼','error'); playErrorSound(); return; }
            const contact = phoneContacts[phoneNumber];
            if(contact) {
                // 正確號碼 (豬肉榮) 或其他號碼都有音檔
                showPhoneStatus(`✓ 撥打給 ${contact.name} ...`, 'success');
                playGitHubAudio(contact.file, () => {

                        showModal(`打錯了！這是 ${contact.name} 的電話。`, '⚠️ 錯誤號碼', '📞');
                    }
                });
            } else {
                showPhoneStatus(i18nStrings[currentLang]['wrongNumber'] || '❌ 號碼錯誤，請重試！','error');
                playErrorSound();
                deductTime(2);

        // 簡化版的畫面切換與其他函數 (保持原有邏輯)
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            if(screenId === 'phoneScreen') { phoneNumber = ''; updatePhoneDisplay(); }
        }
        function showReflection(level) { /* 略，可保留原有反思問題 */ console.log("Reflection level", level); }
        function showModal(msg, title, icon) { alert(msg); } // 簡單示意
        
        // 初始化轉盤
        function initRotaryDial() {
            let plate = document.getElementById('dialPlate');
            if (!plate) return;
            let dSize = 250, hSize = 36, hRad = 90, numRad = 115;
            plate.innerHTML = '';
            let dialNumbers = ['1','2','3','4','5','6','7','8','9','0'];
            let startAngle = -60, angleStep = 30;
            dialNumbers.forEach((num, idx) => {
                let ang = (startAngle + idx * angleStep) * Math.PI/180;
                let hx = dSize/2 + hRad * Math.sin(ang) - hSize/2;
                let hy = dSize/2 - hRad * Math.cos(ang) - hSize/2;
                let hole = document.createElement('div');
                hole.className = 'dial-hole'; hole.dataset.num = num;
                hole.style.cssText = `left:${hx}px;top:${hy}px;width:${hSize}px;height:${hSize}px`;
                plate.appendChild(hole);
                let nx = dSize/2 + numRad * Math.sin(ang);
                let ny = dSize/2 - numRad * Math.cos(ang);
                let lbl = document.createElement('div');
                lbl.className = 'dial-number'; lbl.textContent = num;
                lbl.style.cssText = `left:${nx}px;top:${ny}px;transform:translate(-50%,-50%)`;
                plate.appendChild(lbl);
            });
        }
        
        // 撥號功能
        function dialNumber(num) {
            if(isDialing || phoneNumber.length>=8) return;
            isDialing = true;
            let plate = document.getElementById('dialPlate');
            let target = 40 + (['1','2','3','4','5','6','7','8','9','0'].indexOf(num)+1)*30;
            plate.style.transition = 'transform 0.15s ease-out';
            plate.style.transform = `translate(-50%, -50%) rotate(${target}deg)`;
            playRotaryClickSound();
            setTimeout(()=>{
                plate.style.transition = '';
                plate.style.transform = 'translate(-50%, -50%) rotate(0deg)';
                setTimeout(()=>{
                    isDialing = false;
                    phoneNumber += num;
                    updatePhoneDisplay();
                }, 300);
            },200);
        }
        
        // 事件綁定
        document.addEventListener('DOMContentLoaded', function() {
            // 語言設定
            document.getElementById('langDropdown').addEventListener('change', (e) => { currentLang = e.target.value; updatePhoneDisplay(); });
            initRotaryDial();
            window.addEventListener('resize', initRotaryDial);
            document.getElementById('phoneClearBtn').addEventListener('click', ()=>{ phoneNumber=''; updatePhoneDisplay(); playTone(300,0.1); });
            document.getElementById('phoneCallBtn').addEventListener('click', checkPhoneNumber);
            document.getElementById('dialPlate').addEventListener('click', function(e) {
                let hole = e.target.closest('.dial-hole');
                if(hole && !isDialing) dialNumber(hole.dataset.num);
            });
            // 簡易開始遊戲流程
            document.getElementById('menuStartBtn').addEventListener('click', () => document.getElementById('timerSetupScreen').classList.add('active'));
            document.getElementById('startTimerBtn').addEventListener('click', () => { startTimer(); showScreen('envelope1Screen'); });
            document.getElementById('envelope1ContinueBtn').addEventListener('click', () => showScreen('win95LoginScreen'));
            document.getElementById('win95OkBtn').addEventListener('click', function() {
                let pass = document.getElementById('win95pass').value;
                if(pass.toUpperCase() === 'VRDU') { playSuccessSound(); showReflection(1); setTimeout(()=>showScreen('phoneScreen'),800); }
                else { playErrorSound(); alert('密碼錯誤'); }
            });
            // 其他關卡密碼邏輯 (簡化)
            function startTimer() { timerRunning = true; timerInterval = setInterval(()=>{ if(totalSeconds>0) totalSeconds--; updateTimerDisplay(); },1000); }
            updateTimerDisplay();
        });
    </script>
</body>
